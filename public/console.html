<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>地标管理 - 社区地图</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fontawesome-all.min.css" />
    <style>
        body {
            padding-bottom: env(safe-area-inset-bottom);
            overflow: auto;
            height: auto;
        }
        .admin-main {
            min-height: calc(100vh - 48px);
            background: var(--color-neutral-100);
        }
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid var(--cmap-border);
        }
        .stat-card {
            flex: 1;
            background: var(--color-neutral-100);
            border-radius: var(--cmap-radius-md);
            padding: 12px;
            text-align: center;
        }
        .stat-card .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--cmap-primary);
            line-height: 1.2;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--cmap-muted-foreground);
            margin-top: 4px;
        }
        .list-section-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--cmap-muted-foreground);
            padding: 12px 16px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .landmark-item {
            cursor: pointer;
            transition: background 0.15s;
        }
        .landmark-item:hover {
            background: var(--color-neutral-100);
        }
        .landmark-item.disabled {
            opacity: 0.5;
        }
        .landmark-item.disabled .landmark-icon {
            filter: grayscale(100%);
        }
        .landmark-icon {
            color: white;
        }
        .confirm-dialog {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .confirm-dialog.show {
            opacity: 1;
            visibility: visible;
        }
        .confirm-box {
            background: white;
            border-radius: var(--cmap-radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 320px;
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .confirm-dialog.show .confirm-box {
            transform: scale(1);
        }
        .confirm-box h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--cmap-foreground);
        }
        .confirm-box p {
            font-size: 14px;
            color: var(--cmap-muted-foreground);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .confirm-actions button {
            padding: 8px 16px;
            border-radius: var(--cmap-radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .confirm-cancel {
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
        }
        .confirm-delete {
            background: var(--cmap-destructive);
            color: white;
        }
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 30;
            background: white;
            border-bottom: 1px solid var(--cmap-border);
        }
        .back-to-map {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cmap-primary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 12px;
            margin: 8px 12px 0;
            border-radius: var(--cmap-radius-sm);
            transition: background 0.15s;
            width: fit-content;
        }
        .back-to-map:hover {
            background: rgba(66, 133, 244, 0.08);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .action-btn:hover {
            background: var(--cmap-muted-foreground);
        }
        #import-file {
            display: none;
        }
        .kv-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .kv-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .kv-modal-box {
            background: white;
            border-radius: var(--cmap-radius-lg);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .kv-modal.show .kv-modal-box {
            transform: scale(1);
        }
        .kv-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--cmap-border);
        }
        .kv-modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: var(--cmap-foreground);
        }
        .kv-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--cmap-muted);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--cmap-foreground);
        }
        .kv-modal-body {
            flex: 1;
            margin: 16px;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: var(--cmap-radius-md);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow: auto;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .kv-modal-body.empty-kv {
            text-align: center;
            color: var(--cmap-muted-foreground);
            padding: 20px;
            background: transparent;
            font-family: inherit;
            white-space: normal;
            word-break: normal;
        }
        .config-modal-body {
            flex: 1;
            padding: 16px;
            overflow: auto;
        }
        .config-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .config-item label {
            font-size: 14px;
            font-weight: 500;
            color: var(--cmap-foreground);
        }
        .config-item input {
            padding: 10px 12px;
            border: 1px solid var(--cmap-border);
            border-radius: var(--cmap-radius-md);
            font-size: 14px;
            background: white;
            color: var(--cmap-foreground);
        }
        .config-item input:focus {
            outline: none;
            border-color: var(--cmap-primary);
        }
        .config-desc {
            font-size: 12px;
            color: var(--cmap-muted-foreground);
        }
        .kv-modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--cmap-border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .kv-copy-btn {
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-primary);
            color: white;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kv-copy-btn:hover {
            opacity: 0.9;
        }
        .kv-close-btn {
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .kv-clear-btn {
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: #fef2f2;
            color: #dc2626;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kv-clear-btn:hover {
            background: #fee2e2;
        }
        .map-modal-body {
            flex: 1;
            padding: 16px;
            overflow: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .map-preview {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: var(--cmap-muted);
            border-radius: var(--cmap-radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .map-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .map-preview .map-placeholder {
            color: var(--cmap-muted-foreground);
            font-size: 14px;
            text-align: center;
        }
        .map-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: var(--cmap-muted-foreground);
        }
        .map-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .map-info-row .map-info-label {
            color: var(--cmap-muted-foreground);
        }
        .map-info-row .map-info-value {
            color: var(--cmap-foreground);
            font-weight: 500;
        }
        .map-status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }
        .map-status-tag.custom {
            background: #e6f4ea;
            color: #1e7e34;
        }
        .map-status-tag.default {
            background: var(--cmap-muted);
            color: var(--cmap-muted-foreground);
        }
        .map-upload-area {
            border: 2px dashed var(--cmap-border);
            border-radius: var(--cmap-radius-md);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .map-upload-area:hover {
            border-color: var(--cmap-primary);
            background: rgba(66, 133, 244, 0.04);
        }
        .map-upload-area i {
            font-size: 28px;
            color: var(--cmap-muted-foreground);
            margin-bottom: 8px;
        }
        .map-upload-area p {
            font-size: 13px;
            color: var(--cmap-muted-foreground);
            margin: 0;
        }
        .map-upload-area .map-upload-hint {
            font-size: 11px;
            color: var(--color-neutral-400);
            margin-top: 4px;
        }
        .map-upload-input {
            display: none;
        }
        .map-reset-btn {
            padding: 8px 16px;
            border-radius: var(--cmap-radius-md);
            background: #fef2f2;
            color: #dc2626;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }
        .map-reset-btn:hover {
            background: #fee2e2;
        }
        .map-reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
    </style>
</head>
<body>
    <main class="admin-main">
        <div class="top-nav">
            <header class="admin-header">
                <div class="admin-header-left">
                    <button type="button" class="back-btn" aria-label="返回" onclick="goBack()">
                        <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
                    </button>
                    <h1>地标管理</h1>
                </div>
                <div class="header-actions">
                    <button type="button" class="action-btn" aria-label="查看KV" onclick="viewKvRaw()">
                        <i class="fa-solid fa-database" style="font-size: 14px;"></i>
                        <span>KV</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="导出数据" onclick="exportData()">
                        <i class="fa-solid fa-download" style="font-size: 14px;"></i>
                        <span>导出</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="导入数据" onclick="triggerImport()">
                        <i class="fa-solid fa-upload" style="font-size: 14px;"></i>
                        <span>导入</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="底图管理" onclick="openMapModal()">
                        <i class="fa-solid fa-image" style="font-size: 14px;"></i>
                        <span>底图</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="系统配置" onclick="openConfigModal()">
                        <i class="fa-solid fa-gear" style="font-size: 14px;"></i>
                        <span>配置</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="登出" onclick="handleLogout()" style="background: rgba(234, 67, 53, 0.1); color: #ea4335;">
                        <i class="fa-solid fa-right-from-bracket" style="font-size: 14px;"></i>
                        <span>登出</span>
                    </button>
                    <button type="button" class="add-btn" aria-label="新增地标" onclick="goToEdit()">
                        <i class="fa-solid fa-plus" style="font-size: 16px; color: white;"></i>
                    </button>
                </div>
            </header>

            <a href="/" class="back-to-map">
                <i class="fa-solid fa-map-location-dot" style="font-size: 13px;"></i>
                返回地图
            </a>

            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="搜索地标" oninput="handleSearch(this.value)" />
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-num" id="stat-total">0</div>
                <div class="stat-label">地标总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-visible">0</div>
                <div class="stat-label">已启用</div>
            </div>
        </div>

        <div class="list-section-title">地标列表</div>

        <div class="landmark-list" id="landmark-list">
            <div class="loading-state" id="loading-state">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--cmap-primary);"></i>
                <p>加载中...</p>
            </div>
            <div class="empty-state" id="empty-state" style="display: none;">
                <i class="fa-regular fa-map" style="font-size: 48px; margin-bottom: 12px; opacity: 0.5;"></i>
                <p>暂无地标数据</p>
            </div>
        </div>
    </main>

    <div class="confirm-dialog" id="confirm-dialog">
        <div class="confirm-box">
            <h3>确认删除</h3>
            <p id="confirm-message">确定要删除这个地标吗？此操作不可撤销。</p>
            <div class="confirm-actions">
                <button class="confirm-cancel" onclick="cancelDelete()">取消</button>
                <button class="confirm-delete" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <input type="file" id="import-file" accept=".json" onchange="handleImportFile(this)" />

    <div class="kv-modal" id="kv-modal">
        <div class="kv-modal-box">
            <div class="kv-modal-header">
                <h3>原始 KV 值</h3>
                <button class="kv-modal-close" onclick="closeKvModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="kv-modal-body" id="kv-modal-body"></div>
            <div class="kv-modal-footer">
                <button class="kv-clear-btn" onclick="clearKvValue()">
                    <i class="fa-solid fa-trash"></i>
                    清除KV值
                </button>
                <button class="kv-copy-btn" onclick="restoreDefaults()" style="background: #e6f4ea; color: #1e7e34;">
                    <i class="fa-solid fa-rotate-left"></i>
                    还原默认
                </button>
                <button class="kv-copy-btn" onclick="copyKvValue()">
                    <i class="fa-solid fa-copy"></i>
                    复制
                </button>
                <button class="kv-close-btn" onclick="closeKvModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="kv-modal" id="config-modal">
        <div class="kv-modal-box">
            <div class="kv-modal-header">
                <h3>系统配置</h3>
                <button class="kv-modal-close" onclick="closeConfigModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="config-modal-body">
                <div class="config-form">
                    <div class="config-item">
                        <label>页面标题</label>
                        <input type="text" id="config-title" placeholder="如：瑞金二路街道便民地图" />
                        <span class="config-desc">地图页面显示的标题，以及浏览器标签页标题</span>
                    </div>
                    <div class="config-item">
                        <label>城市区域 (destination_region)</label>
                        <input type="text" id="config-region" placeholder="如：上海" />
                        <span class="config-desc">百度地图导航时使用的城市区域</span>
                    </div>
                    <div class="config-item">
                        <label>边界缓冲 (%)</label>
                        <input type="number" id="config-boundary-buffer" placeholder="10" min="0" max="50" step="1" />
                        <span class="config-desc">地图拖动范围超出图片尺寸的百分比，默认10%</span>
                    </div>
                    <div class="config-item">
                        <label>语音朗读引擎</label>
                        <select id="config-tts-engine" style="padding: 10px 12px; border: 1px solid var(--cmap-border); border-radius: var(--cmap-radius-md); font-size: 14px; background: white; color: var(--cmap-foreground);">
                            <option value="auto">自动选择（推荐）</option>
                            <option value="browser">浏览器自带 (Web Speech)</option>
                            <option value="server">Edge TTS 服务器</option>
                            <option value="disabled">禁用朗读</option>
                        </select>
                        <span class="config-desc">选择地标详情页"朗读介绍"使用的语音引擎</span>
                    </div>
                    <div class="config-item">
                        <label>语音音色</label>
                        <select id="config-tts-voice" style="padding: 10px 12px; border: 1px solid var(--cmap-border); border-radius: var(--cmap-radius-md); font-size: 14px; background: white; color: var(--cmap-foreground);">
                            <option value="">自动选择（按语言匹配）</option>
                            <optgroup label="中文（普通话）">
                                <option value="zh-CN-XiaoxiaoNeural">晓晓 (女声 · 温暖活泼)</option>
                                <option value="zh-CN-XiaoyiNeural">晓伊 (女声 · 温暖亲切)</option>
                                <option value="zh-CN-XiaohanNeural">晓涵 (女声 · 自然流畅)</option>
                                <option value="zh-CN-XiaomengNeural">晓梦 (女声 · 甜美活力)</option>
                                <option value="zh-CN-XiaochenNeural">晓辰 (女声 · 温和从容)</option>
                                <option value="zh-CN-XiaoshuangNeural">晓双 (女声 · 温柔)</option>
                                <option value="zh-CN-XiaoxuanNeural">晓萱 (女声 · 知性)</option>
                                <option value="zh-CN-XiaomoNeural">晓墨 (女声 · 优雅)</option>
                                <option value="zh-CN-XiaozhenNeural">晓甄 (女声 · 自信)</option>
                                <option value="zh-CN-YunxiNeural">云希 (男声 · 稳重)</option>
                                <option value="zh-CN-YunyangNeural">云扬 (男声 · 专业)</option>
                                <option value="zh-CN-XiaoruiNeural">晓睿 (男声 · 儒雅)</option>
                                <option value="zh-CN-YunfengNeural">云枫 (男声 · 成熟)</option>
                                <option value="zh-CN-YunjianNeural">云健 (男声 · 阳光)</option>
                                <option value="zh-CN-YunxiaNeural">云夏 (男声 · 青春)</option>
                            </optgroup>
                            <optgroup label="English">
                                <option value="en-US-JennyNeural">Jenny (Female)</option>
                                <option value="en-US-GuyNeural">Guy (Male)</option>
                            </optgroup>
                            <optgroup label="日本語">
                                <option value="ja-JP-NanamiNeural">Nanami (Female)</option>
                                <option value="ja-JP-KeitaNeural">Keita (Male)</option>
                            </optgroup>
                            <optgroup label="한국어">
                                <option value="ko-KR-SunHiNeural">SunHi (Female)</option>
                                <option value="ko-KR-InJoonNeural">InJoon (Male)</option>
                            </optgroup>
                        </select>
                        <span class="config-desc">Edge TTS 服务器使用的语音音色。选择"自动选择"将根据文本语言自动匹配最佳音色</span>
                    </div>


                </div>
            </div>
            <div class="kv-modal-footer">
                <button class="kv-close-btn" onclick="closeConfigModal()">取消</button>
                <button class="kv-copy-btn" onclick="saveConfig()">保存</button>
            </div>
        </div>
    </div>

    <div class="kv-modal" id="map-modal">
        <div class="kv-modal-box">
            <div class="kv-modal-header">
                <h3>底图管理</h3>
                <button class="kv-modal-close" onclick="closeMapModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="map-modal-body">
                <div class="map-preview" id="map-preview">
                    <div class="map-placeholder"><i class="fa-solid fa-spinner fa-spin"></i> 加载中...</div>
                </div>
                <div class="map-info" id="map-info">
                    <div class="map-info-row">
                        <span class="map-info-label">状态</span>
                        <span class="map-info-value" id="map-status">-</span>
                    </div>
                    <div class="map-info-row">
                        <span class="map-info-label">格式</span>
                        <span class="map-info-value" id="map-type">-</span>
                    </div>
                    <div class="map-info-row">
                        <span class="map-info-label">大小</span>
                        <span class="map-info-value" id="map-size">-</span>
                    </div>
                    <div class="map-info-row">
                        <span class="map-info-label">文件名</span>
                        <span class="map-info-value" id="map-name">-</span>
                    </div>
                    <div class="map-info-row">
                        <span class="map-info-label">更新时间</span>
                        <span class="map-info-value" id="map-updated">-</span>
                    </div>
                </div>
                <div class="map-upload-area" onclick="triggerMapUpload()">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>点击上传新底图</p>
                    <p class="map-upload-hint">支持 webp / png / jpeg，最大 10MB</p>
                </div>
                <input type="file" id="map-upload-input" class="map-upload-input" accept="image/webp,image/png,image/jpeg" onchange="handleMapUpload(this)" />
                <button type="button" class="map-reset-btn" id="map-reset-btn" onclick="handleMapReset()" disabled>
                    <i class="fa-solid fa-rotate-left"></i>
                    恢复默认底图
                </button>
            </div>
            <div class="kv-modal-footer">
                <button class="kv-close-btn" onclick="closeMapModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/console.js"></script>
</body>
</html>
