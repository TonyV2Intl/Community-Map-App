<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>地标管理 - 社区地图</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://registry.npmmirror.com/@fortawesome/fontawesome-free/7.3.1/files/css/all.min.css" />
    <style>
        body {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .admin-main {
            min-height: calc(100vh - 48px);
            background: var(--color-neutral-100);
        }
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: white;
            border-bottom: 1px solid var(--cmap-border);
        }
        .stat-card {
            flex: 1;
            background: var(--color-neutral-100);
            border-radius: var(--cmap-radius-md);
            padding: 12px;
            text-align: center;
        }
        .stat-card .stat-num {
            font-size: 24px;
            font-weight: 700;
            color: var(--cmap-primary);
            line-height: 1.2;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: var(--cmap-muted-foreground);
            margin-top: 4px;
        }
        .list-section-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--cmap-muted-foreground);
            padding: 12px 16px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .landmark-item {
            cursor: pointer;
            transition: background 0.15s;
        }
        .landmark-item:hover {
            background: var(--color-neutral-100);
        }
        .landmark-icon {
            color: white;
        }
        .confirm-dialog {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .confirm-dialog.show {
            opacity: 1;
            visibility: visible;
        }
        .confirm-box {
            background: white;
            border-radius: var(--cmap-radius-lg);
            padding: 24px;
            width: 90%;
            max-width: 320px;
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .confirm-dialog.show .confirm-box {
            transform: scale(1);
        }
        .confirm-box h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--cmap-foreground);
        }
        .confirm-box p {
            font-size: 14px;
            color: var(--cmap-muted-foreground);
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .confirm-actions button {
            padding: 8px 16px;
            border-radius: var(--cmap-radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }
        .confirm-cancel {
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
        }
        .confirm-delete {
            background: var(--cmap-destructive);
            color: white;
        }
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 30;
            background: white;
            border-bottom: 1px solid var(--cmap-border);
        }
        .back-to-map {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cmap-primary);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            padding: 8px 12px;
            margin: 8px 12px 0;
            border-radius: var(--cmap-radius-sm);
            transition: background 0.15s;
            width: fit-content;
        }
        .back-to-map:hover {
            background: rgba(66, 133, 244, 0.08);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
        }
        .action-btn:hover {
            background: var(--cmap-muted-foreground);
        }
        #import-file {
            display: none;
        }
        .kv-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .kv-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .kv-modal-box {
            background: white;
            border-radius: var(--cmap-radius-lg);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .kv-modal.show .kv-modal-box {
            transform: scale(1);
        }
        .kv-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--cmap-border);
        }
        .kv-modal-header h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: var(--cmap-foreground);
        }
        .kv-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--cmap-muted);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--cmap-foreground);
        }
        .kv-modal-body {
            flex: 1;
            padding: 16px;
            overflow: auto;
        }
        .kv-modal-body pre {
            margin: 0;
            padding: 12px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: var(--cmap-radius-md);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow: auto;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .kv-modal-body .empty-kv {
            text-align: center;
            color: var(--cmap-muted-foreground);
            padding: 20px;
        }
        .kv-modal-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--cmap-border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .kv-copy-btn {
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-primary);
            color: white;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kv-copy-btn:hover {
            opacity: 0.9;
        }
        .kv-close-btn {
            padding: 6px 12px;
            border-radius: var(--cmap-radius-md);
            background: var(--cmap-muted);
            color: var(--cmap-foreground);
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <main class="admin-main">
        <div class="top-nav">
            <header class="admin-header">
                <div class="admin-header-left">
                    <button type="button" class="back-btn" aria-label="返回" onclick="goBack()">
                        <i class="fa-solid fa-chevron-left" style="font-size: 16px;"></i>
                    </button>
                    <h1>地标管理</h1>
                </div>
                <div class="header-actions">
                    <button type="button" class="action-btn" aria-label="查看KV" onclick="viewKvRaw()">
                        <i class="fa-solid fa-database" style="font-size: 14px;"></i>
                        <span>KV</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="导出数据" onclick="exportData()">
                        <i class="fa-solid fa-download" style="font-size: 14px;"></i>
                        <span>导出</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="导入数据" onclick="triggerImport()">
                        <i class="fa-solid fa-upload" style="font-size: 14px;"></i>
                        <span>导入</span>
                    </button>
                    <button type="button" class="action-btn" aria-label="登出" onclick="handleLogout()" style="background: rgba(234, 67, 53, 0.1); color: #ea4335;">
                        <i class="fa-solid fa-right-from-bracket" style="font-size: 14px;"></i>
                        <span>登出</span>
                    </button>
                    <button type="button" class="add-btn" aria-label="新增地标" onclick="goToEdit()">
                        <i class="fa-solid fa-plus" style="font-size: 16px; color: white;"></i>
                    </button>
                </div>
            </header>

            <a href="/" class="back-to-map">
                <i class="fa-solid fa-map-location-dot" style="font-size: 13px;"></i>
                返回地图
            </a>

            <div class="search-bar">
                <div class="search-wrapper">
                    <span class="search-icon">
                        <i class="fa-solid fa-magnifying-glass" style="font-size: 14px;"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="搜索地标" oninput="handleSearch(this.value)" />
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-num" id="stat-total">0</div>
                <div class="stat-label">地标总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="stat-visible">0</div>
                <div class="stat-label">已启用</div>
            </div>
        </div>

        <div class="list-section-title">地标列表</div>

        <div class="landmark-list" id="landmark-list">
            <div class="loading-state" id="loading-state">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--cmap-primary);"></i>
                <p>加载中...</p>
            </div>
            <div class="empty-state" id="empty-state" style="display: none;">
                <i class="fa-regular fa-map" style="font-size: 48px; margin-bottom: 12px; opacity: 0.5;"></i>
                <p>暂无地标数据</p>
            </div>
        </div>
    </main>

    <div class="confirm-dialog" id="confirm-dialog">
        <div class="confirm-box">
            <h3>确认删除</h3>
            <p id="confirm-message">确定要删除这个地标吗？此操作不可撤销。</p>
            <div class="confirm-actions">
                <button class="confirm-cancel" onclick="cancelDelete()">取消</button>
                <button class="confirm-delete" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <input type="file" id="import-file" accept=".json" onchange="handleImportFile(this)" />

    <div class="kv-modal" id="kv-modal">
        <div class="kv-modal-box">
            <div class="kv-modal-header">
                <h3>原始 KV 值</h3>
                <button class="kv-modal-close" onclick="closeKvModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="kv-modal-body" id="kv-modal-body"></div>
            <div class="kv-modal-footer">
                <button class="kv-copy-btn" onclick="copyKvValue()">
                    <i class="fa-solid fa-copy"></i>
                    复制
                </button>
                <button class="kv-close-btn" onclick="closeKvModal()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/console.js"></script>
</body>
</html>
